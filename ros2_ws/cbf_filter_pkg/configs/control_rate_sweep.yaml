# Kontrol hizi teshis taramasi (spec'in "ILK KULLANIM" deneyi).
#
# Amac: h(x) < 0 marj ihlalinin kaynagini ayristirmak. QP HER ZAMAN cozuluyor
# (qp_infeasible=0), yani sorun infeasibility degil. Eger ihlal derinligi
# kontrol hiziyla azaliyorsa neden ZOH/ayriklastirma; hizdan BAGIMSIZ ise
# neden alpha ayari veya h(x)/d_safe tanimi (merkez-merkez vs yuzey-yuzey).
#
# alpha bu teshis kapanana kadar 1.0'da SABIT (spec'in acik kurali).
scenario:
  name: rate_sweep
  robot:
    start: [0.0, 0.0, 0.0]
    cmd: {v: 0.22, omega: 0.0}
  obstacle:
    start: [3.0, 0.3, 3.14159]
    velocity: [-0.3, 0.0]
  duration: 15.0
  settle_time: 2.0
filter:
  alpha: 1.0
  d_safe: 0.405
  prediction_horizon: 0.0
  control_rate: 20.0   # sweep tarafindan ezilir

sweep:
  filter.control_rate: [10.0, 20.0, 50.0]
runs_per_cell: 10
